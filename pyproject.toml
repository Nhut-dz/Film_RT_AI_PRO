[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weld-rt"
version = "1.0.0"
description = "Suy luận phát hiện khuyết tật trên phim RT mối hàn + FastAPI demo"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
